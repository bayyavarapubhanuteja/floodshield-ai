# Render Blueprint — FloodShield AI
# Render dashboard → New → Blueprint → select this repo. Creates: API (Docker), web (static), PostgreSQL.
services:
  - type: web
    name: floodshield-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: FS_ENV
        value: production
      - key: FS_SECRET_KEY
        generateValue: true
      - key: FS_DEMO_ACCOUNTS
        value: "true"          # demo logins shown on the login page always work (set false for real use)
      - key: FS_DEFAULT_CITY
        value: hyderabad
      - key: FS_WEATHER_PROVIDER
        value: simulated
      - key: FS_DATABASE_URL
        fromDatabase:
          name: floodshield-db
          property: connectionString
      - key: FS_CORS_ORIGINS
        fromService:
          type: web
          name: floodshield-web
          property: host

  - type: web
    name: floodshield-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: floodshield-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY

databases:
  - name: floodshield-db
    plan: free
    databaseName: floodshield
    user: floodshield
